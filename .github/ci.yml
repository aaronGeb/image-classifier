name: CI / CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{github.ref}}
  cancel-in-progress: true

jobs:

  # Backend tests
  backend-test:
    name: Backend — pytest
    runs-on: ubuntu-latest
    if:
      github.event_name == 'push' || contains(github.event.pull_request.changed_files, 'backend/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -r fastapi uvicorn sqlalchemy alembic pydantic-settings pydantic[email] python-jose[cryptography] passlib[bcrypt] python-multipart psycopg2-binary pytest httpx Pillow


      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: ci-only-secret-key
          ENVIRONMENT: development
          DEBUG: "false"
        run: pytest -v --tb=short

  # Frontend type-check + build
  frontend-build:
    name: Frontend — tsc + vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://placeholder.onrender.com
        run: npm run build

  # Docker build verification
  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./backend -t visionai-backend:ci
      - run: docker build ./frontend -t visionai-frontend:ci

  # Deploy (main only)
  deploy-backend:
    name: Deploy → Render
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy hook
        # Add RENDER_DEPLOY_HOOK to GitHub repo secrets
        # Get it from: Render dashboard → Service → Settings → Deploy Hook
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  deploy-frontend:
    name: Deploy → Vercel
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: "--prod"
